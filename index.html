<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Aniversario</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Aquí conectamos tu nuevo archivo de CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Fondo de estrellas -->
    <div class="stars-container">
        <div class="stars"></div>
        <div class="stars" style="animation-delay: 1s; opacity: 0.5;"></div>
        <div class="stars" style="animation-delay: 2s; opacity: 0.8;"></div>
    </div>

    <section id="view-lock" class="view-container active">
        <div class="text-center mb-8">
            <i class="fas fa-lock text-3xl mb-4" style="color: var(--neon-gold);"></i>
            <h1 class="font-title text-3xl neon-text-gold mb-2 tracking-widest">FELIZ<br>ANIVERSARIO</h1>
            <p class="text-sm text-gray-300">Ingresa nuestra fecha</p>
        </div>

        <div class="flex justify-center mb-10" id="pin-indicators">
            <div class="pin-dot"></div>
            <div class="pin-dot"></div>
            <div class="pin-dot"></div>
            <div class="pin-dot"></div>
            <div class="pin-dot"></div>
            <div class="pin-dot"></div>
        </div>

        <p id="error-msg" class="text-red-500 text-sm h-6 mb-2 opacity-0 transition-opacity">Fecha incorrecta, mi amor.</p>

        <div class="grid grid-cols-3 gap-4 max-w-xs mx-auto">
            <button class="keypad-btn" onclick="addPin('1')">1</button>
            <button class="keypad-btn" onclick="addPin('2')">2</button>
            <button class="keypad-btn" onclick="addPin('3')">3</button>
            <button class="keypad-btn" onclick="addPin('4')">4</button>
            <button class="keypad-btn" onclick="addPin('5')">5</button>
            <button class="keypad-btn" onclick="addPin('6')">6</button>
            <button class="keypad-btn" onclick="addPin('7')">7</button>
            <button class="keypad-btn" onclick="addPin('8')">8</button>
            <button class="keypad-btn" onclick="addPin('9')">9</button>
            <button class="keypad-btn" onclick="clearPin()">C</button>
            <button class="keypad-btn" onclick="addPin('0')">0</button>
            <button class="keypad-btn" onclick="deletePin()"><i class="fas fa-backspace"></i></button>
        </div>
    </section>

    <section id="view-dash" class="view-container">
        <h2 class="font-title text-2xl md:text-4xl mb-10 text-center tracking-wider titulo-degradado">NUESTRO TIEMPO JUNTOS</h2>
        
        <div class="flex flex-row justify-center gap-1 md:gap-2 mb-12 w-full px-2 max-w-2xl mx-auto">
            <div class="box-contador"><div class="time-value" id="t-years">0</div><div class="time-label">AÑOS</div></div>
            <div class="box-contador"><div class="time-value" id="t-months">0</div><div class="time-label">MESES</div></div>
            <div class="box-contador"><div class="time-value" id="t-days">0</div><div class="time-label">DÍAS</div></div>
            <div class="box-contador"><div class="time-value" id="t-hours">0</div><div class="time-label">HORAS</div></div>
            <div class="box-contador"><div class="time-value" id="t-mins">0</div><div class="time-label">MIN</div></div>
            <div class="box-contador"><div class="time-value" id="t-secs">0</div><div class="time-label">SEG</div></div>
        </div>

        <div class="flex flex-row gap-4 mt-4">
            <button class="neon-btn text-xs md:text-sm px-6 py-3" onclick="showView('view-gallery')">VER RECUERDOS</button>
            <button class="neon-btn text-xs md:text-sm px-6 py-3" onclick="showView('view-letter')">LEER CARTA</button>
        </div>
    </section>

    <section id="view-gallery" class="view-container">
        <h2 class="font-title text-2xl neon-text-gold mb-8 tracking-wider">RECUERDOS</h2>
        
        <div class="gallery-wrapper mb-10">
           <div class="gallery-control left" onclick="moveGallery(-1)"></div>
            <div class="gallery-control center" onclick="abrirNotaFoto()"></div>
            <div class="gallery-control right" onclick="moveGallery(1)"></div>
            
            <div class="gallery-item" style="background-image: url('fotos/foto1.jpeg');"></div>
            <div class="gallery-item" style="background-image: url('fotos/foto2.jpeg');"></div>
            <div class="gallery-item" style="background-image: url('fotos/foto3.jpeg');"></div>
            <div class="gallery-item" style="background-image: url('fotos/foto4.jpeg');"></div>
            <div class="gallery-item" style="background-image: url('fotos/foto5.jpeg');"></div>
        </div>

        <button class="neon-btn mt-4" onclick="showView('view-dash')">VOLVER</button>
    </section>

    <section id="view-letter" class="view-container">
        <div class="letter-box neon-border-gold mb-8 relative">
            <i class="fas fa-heart absolute top-4 right-4 text-pink-500 opacity-50"></i>
            <div id="contenido-carta"></div>
        </div>

        <button class="neon-btn" onclick="showView('view-dash')">VOLVER</button>
    </section>

    <!-- Aquí conectamos tu nuevo archivo de JavaScript -->
    <script src="script.js"></script>
    <!-- Modal emergente para las notas de cada foto -->
    <div id="photo-modal" class="fixed inset-0 z-50 hidden flex-col items-center justify-center bg-black/80 backdrop-blur-md opacity-0 transition-opacity duration-300">
        <div class="letter-box neon-border-gold mb-8 relative mx-4">
            <i class="fas fa-heart absolute top-4 right-4 text-pink-500 opacity-80"></i>
            <div id="photo-modal-text" class="text-white mt-4 font-inter">
                <!-- El texto personalizado se insertará aquí -->
            </div>
        </div>
        <button class="neon-btn" style="border-color: var(--neon-pink);" onclick="cerrarNotaFoto()">VOLVER</button>
    </div>
</body>
</html>
